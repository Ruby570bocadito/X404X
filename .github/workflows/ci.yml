name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: .
          args: --timeout=5m

  go-test:
    needs: go-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go tests
        run: go test ./core/... ./shared/... -v -cover

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint Python
        run: ruff check modules/ scripts/

  python-test:
    needs: python-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pytest
      - name: Run Python tests
        run: pytest modules/bridge/ modules/evasion/ -v

  proto-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: bufbuild/buf-lint-action@v1
        with:
          input: core/proto

  build-agent:
    needs: [go-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build agent
        run: |
          GOOS=$(echo ${{ matrix.target }} | cut -d/ -f1) \
          GOARCH=$(echo ${{ matrix.target }} | cut -d/ -f2) \
          go build -o dist/agent-$GOOS-$GOARCH ./core/agent/cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.target }}
          path: dist/
