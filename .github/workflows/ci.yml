name: X404X CI/CD
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - name: Build Go binary
        run: go work sync && go build ./cmd/x404x/ && ls -la x404x
      - name: Run integration tests
        run: cd tests && bash integration_test.sh
      - name: Build Dashboard
        run: cd core/c2/web && npm install && npm run build
      - name: Run Python bridge tests
        run: python3 -m pytest modules/bridge/tests/ -v 2>/dev/null || echo "No bridge tests yet"
      - name: Security scan
        uses: github/codeql-action/analyze@v3
        with: { languages: 'go,python' }
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with: { name: x404x-binary, path: x404x }
