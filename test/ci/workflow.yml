name: X404X Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  go-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: Go Core Tests
        run: |
          go version
          go test -v -count=1 -timeout 120s -race ./internal/appstate/... ./internal/dispatch/... ./internal/crypto/... ./internal/agent/... ./internal/orchestrator/... ./internal/registry/... ./internal/defense/... 2>&1

  go-ransomware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: Go Ransomware Tests
        run: |
          go test -v -count=1 -timeout 180s ./internal/ransomware/... 2>&1

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  python-bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout
      - name: Bridge Smoke Tests
        run: |
          python modules/bridge/tests/test_all_handlers.py
      - name: Bridge Unittest
        run: |
          python -m unittest modules/bridge/tests.test_handlers -v

  plugins-worm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Worm Unit Tests
        run: |
          pip install pytest
          python -m pytest plugins/worm/tests/test_unit.py -v --timeout=30 || true

  plugins-specter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SPECTER Unit Tests
        run: |
          pip install pytest pytest-asyncio
          python -m pytest plugins/ai/specter/tests/test_core.py plugins/ai/specter/tests/test_permissions.py plugins/ai/specter/tests/test_session.py -v --timeout=30 || true

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integration Tests
        run: |
          bash test/integration/run_integration.sh

  coverage:
    runs-on: ubuntu-latest
    needs: [go-core, go-ransomware]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Generate coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./internal/... 2>&1 || true
          go tool cover -func=coverage.out | tail -30
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false
